<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Type Matchup Console</title>
<style>
  :root{
    --bg:#0d0f14;
    --panel:#161922;
    --panel-2:#1d212c;
    --line:#2a2f3d;
    --text:#e8e9ee;
    --dim:#8890a4;
    --super:#4fd67a;
    --notvery:#e05a5a;
    --immune:#5a5f70;
    --neutral:#3a3f4f;
    --mono: 'SFMono-Regular', 'Consolas', 'Menlo', monospace;
    --sans: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #1a1e2a 0%, transparent 45%),
      radial-gradient(circle at 90% 100%, #171b26 0%, transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    padding:28px 20px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
    gap:10px;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.18em;
    color:var(--dim);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  h1{
    margin:0;
    font-size:26px;
    letter-spacing:.02em;
    font-weight:800;
  }
  .status{
    font-family:var(--mono);
    font-size:11px;
    color:var(--dim);
    text-align:right;
    line-height:1.6;
  }
  .status b{color:var(--text);}

  /* type selector grid */
  .selector{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
    gap:8px;
    margin-bottom:24px;
  }
  .chip{
    position:relative;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    font-family:var(--mono);
    font-size:11.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:10px 8px;
    border-radius:6px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:7px;
    transition:transform .08s ease, border-color .12s ease, background .12s ease;
  }
  .chip:hover{border-color:var(--tc); transform:translateY(-1px);}
  .chip.active{
    background:var(--tc);
    color:#0d0f14;
    border-color:var(--tc);
    font-weight:700;
  }
  .dot{
    width:9px;height:9px;border-radius:2px;
    background:var(--tc);
    flex:none;
  }
  .chip.active .dot{background:#0d0f14; opacity:.55;}

  /* detail panel */
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px;
    margin-bottom:26px;
  }
  .panel-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
  }
  .badge{
    width:44px;height:44px;
    border-radius:9px;
    background:var(--tc);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);
    font-weight:800;
    color:#0d0f14;
    font-size:13px;
    letter-spacing:.02em;
    flex:none;
  }
  .panel-head h2{
    margin:0;
    font-size:20px;
  }
  .panel-head .sub{
    font-family:var(--mono);
    font-size:11px;
    color:var(--dim);
    margin-top:2px;
  }

  .cols{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
  }
  @media(max-width:700px){.cols{grid-template-columns:1fr;}}

  .colhead{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--dim);
    margin:0 0 10px;
    padding-bottom:6px;
    border-bottom:1px dashed var(--line);
  }
  .rowset{margin-bottom:14px;}
  .rowset:last-child{margin-bottom:0;}
  .rowset .label{
    font-family:var(--mono);
    font-size:11px;
    margin-bottom:6px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .rowset .label .n{color:var(--dim);}
  .taglist{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{
    font-family:var(--mono);
    font-size:11px;
    padding:4px 8px;
    border-radius:5px;
    background:var(--panel-2);
    border:1px solid var(--line);
  }
  .empty{
    font-family:var(--mono);
    font-size:11px;
    color:var(--dim);
    font-style:italic;
  }
  .super .label{color:var(--super);}
  .notvery .label{color:var(--notvery);}
  .immune .label{color:var(--dim);}

  /* matrix */
  .matrix-wrap{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px;
    overflow-x:auto;
  }
  .matrix-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:8px;
  }
  .matrix-title .colhead{border:none;padding:0;margin:0;}
  .legend{
    display:flex;
    gap:14px;
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--dim);
  }
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .sw{width:10px;height:10px;border-radius:2px;display:inline-block;}

  table{border-collapse:collapse; font-family:var(--mono); font-size:11px;}
  th,td{
    width:30px;height:26px;
    text-align:center;
    border:1px solid #1a1e28;
  }
  th{
    background:var(--panel-2);
    color:var(--dim);
    font-weight:600;
    position:sticky;
    top:0;
  }
  th.rowh{
    position:sticky;
    left:0;
    z-index:2;
    text-align:right;
    padding-right:8px;
    background:var(--panel-2);
  }
  th.corner{position:sticky; left:0; top:0; z-index:3;}
  td{color:var(--text);}
  td.m2{background:rgba(79,214,122,.30);}
  td.m4{background:rgba(79,214,122,.55); font-weight:800;}
  td.mh{background:rgba(224,90,90,.28);}
  td.mq{background:rgba(224,90,90,.5); opacity:.85;}
  td.m0{background:rgba(90,95,112,.55); color:var(--dim);}
  td.m1{color:#454b5c;}
  tr.hi-row td, tr.hi-row th.rowh{outline:1px solid var(--tc-row, transparent); outline-offset:-1px;}
  th.hi-col{outline:1px solid var(--tc-col,transparent); outline-offset:-1px;}

  footer{
    margin-top:22px;
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--dim);
    text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <p class="eyebrow">// type matchup console</p>
      <h1>Pokémon Type Reference</h1>
    </div>
    <div class="status">
      selected: <b id="statSel">—</b><br>
      gen 6+ chart (fairy included)
    </div>
  </header>

  <div class="selector" id="selector"></div>

  <div class="panel" id="detailPanel"></div>

  <div class="matrix-wrap">
    <div class="matrix-title">
      <p class="colhead">Full 18×18 matchup grid — rows attack, columns defend</p>
      <div class="legend">
        <span><i class="sw" style="background:rgba(79,214,122,.55)"></i>4×</span>
        <span><i class="sw" style="background:rgba(79,214,122,.3)"></i>2×</span>
        <span><i class="sw" style="background:#2a2f3d"></i>1×</span>
        <span><i class="sw" style="background:rgba(224,90,90,.28)"></i>½×</span>
        <span><i class="sw" style="background:rgba(224,90,90,.5)"></i>¼×</span>
        <span><i class="sw" style="background:rgba(90,95,112,.55)"></i>0×</span>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table id="matrixTable"></table>
    </div>
  </div>

  <footer>click any type above to see what it hits hard, what shrugs it off, and what it's vulnerable to</footer>
</div>

<script>
const COLORS = {
  Normal:'#A8A878', Fire:'#F08030', Water:'#6890F0', Electric:'#F8D030',
  Grass:'#78C850', Ice:'#98D8D8', Fighting:'#C03028', Poison:'#A040A0',
  Ground:'#E0C068', Flying:'#A890F0', Psychic:'#F85888', Bug:'#A8B820',
  Rock:'#B8A038', Ghost:'#705898', Dragon:'#7038F8', Dark:'#705848',
  Steel:'#B8B8D0', Fairy:'#EE99AC'
};
const TYPES = Object.keys(COLORS);

// attacker -> {defender: multiplier}, only non-1x entries listed
const CHART = {
  Normal:   {Rock:.5, Ghost:0, Steel:.5},
  Fire:     {Fire:.5, Water:.5, Grass:2, Ice:2, Bug:2, Rock:.5, Dragon:.5, Steel:2},
  Water:    {Fire:2, Water:.5, Grass:.5, Ground:2, Rock:2, Dragon:.5},
  Electric: {Water:2, Electric:.5, Grass:.5, Ground:0, Flying:2, Dragon:.5},
  Grass:    {Fire:.5, Water:2, Grass:.5, Poison:.5, Ground:2, Flying:.5, Bug:.5, Rock:2, Dragon:.5, Steel:.5},
  Ice:      {Fire:.5, Water:.5, Grass:2, Ice:.5, Ground:2, Flying:2, Dragon:2, Steel:.5},
  Fighting: {Normal:2, Ice:2, Poison:.5, Flying:.5, Psychic:.5, Bug:.5, Rock:2, Ghost:0, Dark:2, Steel:2, Fairy:.5},
  Poison:   {Grass:2, Poison:.5, Ground:.5, Rock:.5, Ghost:.5, Steel:0, Fairy:2},
  Ground:   {Fire:2, Electric:2, Grass:.5, Poison:2, Flying:0, Bug:.5, Rock:2, Steel:2},
  Flying:   {Electric:.5, Grass:2, Fighting:2, Bug:2, Rock:.5, Steel:.5},
  Psychic:  {Fighting:2, Poison:2, Psychic:.5, Dark:0, Steel:.5},
  Bug:      {Fire:.5, Grass:2, Fighting:.5, Poison:.5, Flying:.5, Psychic:2, Ghost:.5, Dark:2, Steel:.5, Fairy:.5},
  Rock:     {Fire:2, Ice:2, Fighting:.5, Ground:.5, Flying:2, Bug:2, Steel:.5},
  Ghost:    {Normal:0, Psychic:2, Ghost:2, Dark:.5},
  Dragon:   {Dragon:2, Steel:.5, Fairy:0},
  Dark:     {Fighting:.5, Psychic:2, Ghost:2, Dark:.5, Fairy:.5},
  Steel:    {Fire:.5, Water:.5, Electric:.5, Ice:2, Rock:2, Steel:.5, Fairy:2},
  Fairy:    {Fire:.5, Fighting:2, Poison:.5, Dragon:2, Dark:2, Steel:.5},
};

function mult(atk, def){
  const v = CHART[atk] && CHART[atk][def];
  return v === undefined ? 1 : v;
}

// ---- build selector ----
const selector = document.getElementById('selector');
TYPES.forEach(t=>{
  const b = document.createElement('button');
  b.className = 'chip';
  b.style.setProperty('--tc', COLORS[t]);
  b.dataset.type = t;
  b.innerHTML = `<span class="dot"></span>${t}`;
  b.onclick = ()=> select(t);
  selector.appendChild(b);
});

// ---- build matrix ----
const table = document.getElementById('matrixTable');
function abbr(t){ return t.slice(0,3).toUpperCase(); }
function classFor(v){
  if(v===0) return 'm0';
  if(v===4) return 'm4';
  if(v===2) return 'm2';
  if(v===0.25) return 'mq';
  if(v===0.5) return 'mh';
  return 'm1';
}
function labelFor(v){
  if(v===1) return '·';
  if(v===0.25) return '¼';
  if(v===0.5) return '½';
  return v;
}
let theadRow = '<tr><th class="corner">ATK ▸ DEF</th>' + TYPES.map(d=>`<th data-col="${d}" title="${d}">${abbr(d)}</th>`).join('') + '</tr>';
let bodyRows = TYPES.map(a=>{
  const cells = TYPES.map(d=>{
    const v = mult(a,d);
    return `<td class="${classFor(v)}" data-col="${d}">${labelFor(v)}</td>`;
  }).join('');
  return `<tr data-row="${a}"><th class="rowh" title="${a}">${abbr(a)}</th>${cells}</tr>`;
}).join('');
table.innerHTML = theadRow + bodyRows;

// ---- detail panel ----
const panel = document.getElementById('detailPanel');
const statSel = document.getElementById('statSel');

function groupBy(list, pred){ return list.filter(pred); }

function select(type){
  statSel.textContent = type;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.dataset.type===type));

  // matrix highlight
  document.querySelectorAll('tr[data-row]').forEach(r=>{
    r.classList.toggle('hi-row', r.dataset.row===type);
    r.style.setProperty('--tc-row', COLORS[type]);
  });
  document.querySelectorAll('th[data-col]').forEach(c=>{
    c.classList.toggle('hi-col', c.dataset.col===type);
    c.style.setProperty('--tc-col', COLORS[type]);
  });

  // ATTACKING: this type's moves vs every defending type
  const atkEntries = TYPES.map(d=>({t:d, v:mult(type,d)}));
  const atk4 = atkEntries.filter(e=>e.v===4);
  const atk2 = atkEntries.filter(e=>e.v===2);
  const atk0 = atkEntries.filter(e=>e.v===0);
  const atkH = atkEntries.filter(e=>e.v===0.5);
  const atkQ = atkEntries.filter(e=>e.v===0.25);

  // DEFENDING: every attacking type vs this type
  const defEntries = TYPES.map(a=>({t:a, v:mult(a,type)}));
  const def4 = defEntries.filter(e=>e.v===4);
  const def2 = defEntries.filter(e=>e.v===2);
  const def0 = defEntries.filter(e=>e.v===0);
  const defH = defEntries.filter(e=>e.v===0.5);
  const defQ = defEntries.filter(e=>e.v===0.25);

  function tagRow(list){
    if(!list.length) return '<p class="empty">none</p>';
    return `<div class="taglist">${list.map(e=>`<span class="tag">${e.t}</span>`).join('')}</div>`;
  }

  panel.innerHTML = `
    <div class="panel-head">
      <div class="badge" style="--tc:${COLORS[type]}">${abbr(type)}</div>
      <div>
        <h2>${type}</h2>
        <div class="sub">attacking effectiveness &nbsp;/&nbsp; defensive matchups</div>
      </div>
    </div>
    <div class="cols">
      <div>
        <p class="colhead">Attacking with ${type} moves</p>
        <div class="rowset super">
          <div class="label">Super effective (2×) <span class="n">— ${atk2.length}</span></div>
          ${tagRow(atk2)}
        </div>
        <div class="rowset notvery">
          <div class="label">Not very effective (½×) <span class="n">— ${atkH.length}</span></div>
          ${tagRow(atkH)}
        </div>
        <div class="rowset immune">
          <div class="label">No effect (0×) <span class="n">— ${atk0.length}</span></div>
          ${tagRow(atk0)}
        </div>
      </div>
      <div>
        <p class="colhead">Defending as ${type}</p>
        <div class="rowset notvery">
          <div class="label">Weak to (2× damage taken) <span class="n">— ${def2.length}</span></div>
          ${tagRow(def2)}
        </div>
        <div class="rowset super">
          <div class="label">Resists (½× damage taken) <span class="n">— ${defH.length}</span></div>
          ${tagRow(defH)}
        </div>
        <div class="rowset immune">
          <div class="label">Immune to (0× damage taken) <span class="n">— ${def0.length}</span></div>
          ${tagRow(def0)}
        </div>
      </div>
    </div>
  `;
}

select('Fire');
</script>
</body>
</html>
